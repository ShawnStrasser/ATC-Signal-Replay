name: Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'software_validation/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'software_validation/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/unit-tests.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with dev extras
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Build package
      run: python -m build

    # Live tests (marker "live") are deselected by the default addopts in
    # pyproject.toml and never run in CI.
    - name: Run tests with coverage
      run: pytest --cov=signal_replay --cov-report=xml --junitxml=pytest-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'

    - name: Upload pytest results
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: pytest-results.xml
      if: ${{ always() }}

  publish:
    name: publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/signal_replay
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Check release tag matches package version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        pip install dist/*.whl --no-deps
        PACKAGE_VERSION=$(cd /tmp && python -c "import importlib.metadata as m; print(m.version('signal_replay'))")
        SOURCE_VERSION=$(python -c "import ast, pathlib; t = ast.parse(pathlib.Path('src/signal_replay/__init__.py').read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and any(getattr(x, 'id', None) == '__version__' for x in n.targets)))")
        TAG_VERSION="${RELEASE_TAG#v}"
        echo "tag=${TAG_VERSION} wheel=${PACKAGE_VERSION} __version__=${SOURCE_VERSION}"
        if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ] || [ "${TAG_VERSION}" != "${SOURCE_VERSION}" ]; then
          echo "::error::Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}"
          exit 1
        fi

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Uses the PYPI_TOKEN secret when present; leave the secret unset to
      # switch to trusted publishing (OIDC) once it is configured on PyPI.
      with:
        password: ${{ secrets.PYPI_TOKEN }}
